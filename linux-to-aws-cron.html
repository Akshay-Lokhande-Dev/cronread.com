<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linux Cron to AWS EventBridge Cron Converter | CronRead</title><meta name="description" content="Convert a 5-field Linux crontab schedule to a 6-field AWS EventBridge cron expression. See what changes and copy the AWS-ready schedule."><link rel="canonical" href="https://cronread.com/linux-to-aws-cron/"><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:auto;padding:24px;line-height:1.6}input,button{padding:12px;font-size:16px;width:100%;max-width:620px}button{width:auto;margin-top:10px}code{background:#f2f2f2;padding:4px 7px}.box{border:1px solid #ddd;border-radius:10px;padding:18px;margin:18px 0}.error{color:#b00020}</style></head><body><p><a href="/">← CronRead</a></p><h1>Linux Cron to AWS EventBridge Cron Converter</h1><p>Convert a standard 5-field Linux cron expression into the AWS EventBridge 6-field format.</p><div class="box"><input id="i" value="0 9 * * 1-5"><br><button onclick="c()">Convert to AWS</button><h2 id="o"></h2><p id="e" class="error"></p></div><p><a href="/aws-cron-generator/">Validate an AWS cron expression</a> · <a href="/aws-rate-expression-generator/">Generate an AWS rate expression</a></p><script>function c(){let a=document.getElementById('i').value.trim().split(/\s+/),o=document.getElementById('o'),e=document.getElementById('e');e.textContent='';if(a.length!==5){o.textContent='';e.textContent='Please enter exactly 5 fields.';return}let[m,h,dom,mon,dow]=a;if(dom!=='*'&&dow!=='*'){o.textContent='Manual conversion needed: both day fields are specified.';return}if(dom==='*')dom='?';else dow='?';const d={'0':'SUN','1':'MON','2':'TUE','3':'WED','4':'THU','5':'FRI','6':'SAT','7':'SUN'};if(d[dow])dow=d[dow];o.textContent='cron('+[m,h,dom,mon,dow,'*'].join(' ')+')'}</script></body></html>
