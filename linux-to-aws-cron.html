<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linux Cron to AWS EventBridge Cron Converter | CronRead</title><meta name="description" content="Convert common 5-field Linux crontab schedules to AWS EventBridge cron expressions, including weekday numbers, ranges and lists."><link rel="canonical" href="https://cronread.com/linux-to-aws-cron/"><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:auto;padding:24px;line-height:1.6}input,button{padding:12px;font-size:16px;width:100%;max-width:620px}button{width:auto;margin-top:10px}code{background:#f2f2f2;padding:4px 7px}.box{border:1px solid #ddd;border-radius:10px;padding:18px;margin:18px 0}.error{color:#b00020}.ok{color:#087a32}</style></head><body><p><a href="/">← CronRead</a></p><h1>Linux Cron to AWS EventBridge Cron Converter</h1><p>Convert common 5-field Linux cron expressions into AWS EventBridge 6-field syntax.</p><div class="box"><label for="i"><strong>Linux cron (5 fields)</strong></label><br><input id="i" value="0 9 * * 1-5"><br><button onclick="c()">Convert to AWS</button><h2 id="o"></h2><p id="e" class="error"></p></div><h2>Example</h2><p><code>0 9 * * 1-5</code> becomes <code>cron(0 9 ? * MON-FRI *)</code>.</p><p><a href="/aws-cron-generator/">Validate the AWS expression</a> · <a href="/aws-rate-expression-generator/">Generate an AWS rate expression</a></p><script>const D={0:'SUN',1:'MON',2:'TUE',3:'WED',4:'THU',5:'FRI',6:'SAT',7:'SUN'};function convDow(s){return s.split(',').map(part=>{const q=part.split('/');q[0]=q[0].split('-').map(x=>D[x]||x).join('-');return q.join('/')}).join(',')}function c(){const a=document.getElementById('i').value.trim().split(/\s+/),o=document.getElementById('o'),e=document.getElementById('e');o.textContent='';e.textContent='';o.className='';if(a.length!==5){e.textContent='Please enter exactly 5 Linux cron fields.';return}let[m,h,dom,mon,dow]=a;if(dom!=='*'&&dow!=='*'){e.textContent='This expression specifies both day-of-month and day-of-week. Conversion is ambiguous because AWS requires ? in one of these fields.';return}if(!/^[0-9*/?,\-]+$/.test(dow)&&dow!=='*'){e.textContent='Unsupported Linux day-of-week syntax. Please use numeric values, ranges, lists or steps.';return}if(dom==='*')dom='?';else dow='?';if(dow!=='?')dow=convDow(dow);o.className='ok';o.textContent='cron('+[m,h,dom,mon,dow,'*'].join(' ')+')'}</script></body></html>
